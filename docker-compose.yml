services:
  postgres:
    image: postgres:15
    container_name: diariobordo-db
    environment:
      POSTGRES_DB: diariobordo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./diariobordo
    container_name: diariobordo-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: diariobordo
      PGUSER: postgres
      PGPASSWORD: postgres
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
