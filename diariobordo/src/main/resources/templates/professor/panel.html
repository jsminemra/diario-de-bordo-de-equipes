<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel da Professora - Diário de Bordo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="bg-primary text-white p-3 rounded">
                    <h2><i class="fas fa-chalkboard-teacher"></i> Painel da Professora</h2>
                    <p class="mb-0">Visão geral de todas as equipes e sprints</p>
                </div>
            </div>
        </div>

        <!-- Cards de estatísticas -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-users"></i> Total de Equipes</h5>
                        <h2 class="card-text" th:text="${totalTeams}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-user-friends"></i> Total de Usuários</h5>
                        <h2 class="card-text" th:text="${totalUsers}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-tasks"></i> Sprints Ativas</h5>
                        <h2 class="card-text">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista de Equipes -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0"><i class="fas fa-list"></i> Equipes Cadastradas</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(teams)}" class="alert alert-info">
                            <i class="fas fa-info-circle"></i> Nenhuma equipe cadastrada ainda.
                        </div>
                        
                        <div th:unless="${#lists.isEmpty(teams)}" class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th><i class="fas fa-tag"></i> Nome da Equipe</th>
                                        <th><i class="fas fa-user-tie"></i> Líder</th>
                                        <th><i class="fas fa-users"></i> Membros</th>
                                        <th><i class="fas fa-calendar"></i> Criada em</th>
                                        <th><i class="fas fa-chart-line"></i> Progresso</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="team, iterStat : ${teams}">
                                        <td th:text="${iterStat.count}">1</td>
                                        <td>
                                            <strong th:text="${team.name}"></strong>
                                        </td>
                                        <td>
                                            <span th:text="${team.leader.name}"></span>
                                            <br>
                                            <small class="text-muted" th:text="${team.leader.email}"></small>
                                        </td>
                                        <td>
                                            <span class="badge bg-primary" th:text="${team.members.size()}"></span>
                                            <button type="button" class="btn btn-sm btn-link" 
                                                    th:data-bs-toggle="modal" 
                                                    th:data-bs-target="'#membersModal' + ${team.id}">
                                                Ver membros
                                            </button>
                                        </td>
                                        <td>
                                            <span th:text="${#temporals.format(team.createdAt, 'dd/MM/yyyy')}"></span>
                                        </td>
                                        <td>
                                            <div class="progress" style="height: 20px;">
                                                <div class="progress-bar" role="progressbar" 
                                                     style="width: 0%" 
                                                     aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                                                    0%
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <a th:href="@{/professor/team/{id}(id=${team.id})}" 
                                               class="btn btn-sm btn-outline-primary">
                                                <i class="fas fa-eye"></i> Detalhes
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modais para listar membros -->
    <div th:each="team : ${teams}" th:id="'membersModal' + ${team.id}" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" th:text="'Membros da Equipe: ' + ${team.name}"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul class="list-group">
                        <li th:each="member : ${team.members}" class="list-group-item">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <strong th:text="${member.name}"></strong>
                                    <br>
                                    <small class="text-muted" th:text="${member.email}"></small>
                                </div>
                                <span th:if="${member.id == team.leader.id}" class="badge bg-warning">Líder</span>
                                <span th:unless="${member.id == team.leader.id}" class="badge bg-secondary">Membro</span>
                            </div>
                        </li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
