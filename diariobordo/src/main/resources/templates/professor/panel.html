<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel da Professora - Diário de Bordo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .progress-bar-container {
            background-color: #e9ecef;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            position: relative;
            margin: 5px 0;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            border-radius: 10px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 5px;
            font-size: 12px;
            color: white;
            font-weight: bold;
        }
        .release-card {
            border-left: 4px solid #007bff;
            margin-bottom: 8px;
            padding: 6px 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        .release-card.completed {
            border-left-color: #28a745;
        }
        .release-card.in-progress {
            border-left-color: #ffc107;
        }
        .sprint-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }
        .sprint-dot.completed {
            background-color: #28a745;
        }
        .sprint-dot.pending {
            background-color: #dee2e6;
        }
        .team-card {
            transition: transform 0.2s;
            cursor: pointer;
        }
        .team-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .badge-sprints {
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="bg-primary text-white p-3 rounded">
                    <h2><i class="fas fa-chalkboard-teacher"></i> Painel da Professora</h2>
                    <p class="mb-0">Visão geral de todas as equipes e progresso das sprints</p>
                </div>
            </div>
        </div>

        <!-- Cards de estatísticas -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-users"></i> Total de Equipes</h5>
                        <h2 class="card-text" th:text="${totalTeams}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-user-friends"></i> Total de Usuários</h5>
                        <h2 class="card-text" th:text="${totalUsers}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-tasks"></i> Progresso Médio</h5>
                        <h2 class="card-text" th:text="${avgProgress} + '%'">0%</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista de Equipes com Progresso -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0"><i class="fas fa-list"></i> Equipes Cadastradas</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(teams)}" class="alert alert-info">
                            <i class="fas fa-info-circle"></i> Nenhuma equipe cadastrada ainda.
                        </div>
                        
                        <div th:unless="${#lists.isEmpty(teams)}">
                            <div class="row">
                                <div th:each="team, iterStat : ${teams}" class="col-md-6 mb-4">
                                    <div class="card team-card h-100">
                                        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                                            <h5 class="mb-0" th:text="${team.name}">Equipe</h5>
                                            <span class="badge bg-light text-dark">
                                                <i class="fas fa-users"></i> <span th:text="${team.members.size()}">0</span>
                                            </span>
                                        </div>
                                        <div class="card-body">
                                            <p><strong>Líder:</strong> <span th:text="${team.leader.name}"></span></p>
                                            
                                            <div th:with="progress=${teamProgressList[iterStat.index]}">
                                                <!-- Barra de Progresso Geral -->
                                                <div class="d-flex justify-content-between">
                                                    <small>Progresso Geral</small>
                                                    <small th:text="${progress.progressPercentage} + '%'"></small>
                                                </div>
                                                <div class="progress-bar-container">
                                                    <div class="progress-bar-fill" 
                                                         th:style="'width: ' + ${progress.progressPercentage} + '%'"
                                                         th:text="${progress.progressPercentage} + '%'">
                                                    </div>
                                                </div>
                                                
                                                <!-- Releases -->
                                                <div class="mt-2">
                                                    <small>Releases:</small>
                                                    <div th:each="release : ${progress.releases}" class="release-card mt-1">
                                                        <div class="d-flex justify-content-between align-items-center">
                                                            <span class="small" th:text="${release.releaseName}"></span>
                                                            <span class="badge-sprints">
                                                                <span th:text="${release.completedSprints}"></span>
                                                                <span>/</span>
                                                                <span th:text="${release.totalSprints}"></span>
                                                                <span class="ms-1">
                                                                    <span th:each="sprint : ${release.sprints}">
                                                                        <span class="sprint-dot" 
                                                                              th:classappend="${sprint.completed} ? 'completed' : 'pending'"
                                                                              th:title="${sprint.completed} ? 'Sprint ' + ${sprint.sprintNumber} + ' concluída' : 'Sprint ' + ${sprint.sprintNumber} + ' pendente'">
                                                                        </span>
                                                                    </span>
                                                                </span>
                                                            </span>
                                                        </div>
                                                        <div class="progress-bar-container" style="height: 6px;">
                                                            <div class="progress-bar-fill" 
                                                                 th:style="'width: ' + ${release.progressPercentage} + '%'"
                                                                 style="height: 6px; font-size: 0;">
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                
                                                <!-- Sprint Atual -->
                                                <div class="mt-2">
                                                    <span th:if="${progress.currentSprintName != null}" class="badge bg-warning">
                                                        <i class="fas fa-spinner fa-spin"></i> 
                                                        Atual: <span th:text="${progress.currentSprintName}"></span>
                                                    </span>
                                                    <span th:unless="${progress.currentSprintName != null}" class="badge bg-secondary">
                                                        <i class="fas fa-pause"></i> Nenhuma sprint ativa
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="card-footer bg-transparent">
                                            <div class="d-flex flex-wrap gap-1">
                                                <a th:href="@{/professor/team/{id}(id=${team.id})}" 
                                                   class="btn btn-outline-primary btn-sm">
                                                    <i class="fas fa-eye"></i> Detalhes
                                                </a>
                                                <button class="btn btn-outline-secondary btn-sm" 
                                                        th:data-bs-toggle="modal" 
                                                        th:data-bs-target="'#membersModal' + ${team.id}">
                                                    <i class="fas fa-users"></i> Membros
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modais para listar membros -->
    <div th:each="team : ${teams}" th:id="'membersModal' + ${team.id}" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" th:text="'Membros da Equipe: ' + ${team.name}"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul class="list-group">
                        <li th:each="member : ${team.members}" class="list-group-item">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <strong th:text="${member.name}"></strong>
                                    <br>
                                    <small class="text-muted" th:text="${member.email}"></small>
                                </div>
                                <span th:if="${member.id == team.leader.id}" class="badge bg-warning">Líder</span>
                                <span th:unless="${member.id == team.leader.id}" class="badge bg-secondary">Membro</span>
                            </div>
                        </li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
