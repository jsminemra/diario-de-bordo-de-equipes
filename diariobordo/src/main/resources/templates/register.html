<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Diário de Bordo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .role-option {
            cursor: pointer;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .role-option:hover {
            border-color: #0d6efd;
            background-color: #f8f9fa;
        }
        .role-option.selected {
            border-color: #0d6efd;
            background-color: #e7f1ff;
        }
        .role-option input[type="radio"] {
            display: none;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-success text-white text-center">
                        <h3 class="mb-0">📓 Criar Conta</h3>
                        <small>Diário de Bordo de Equipes</small>
                    </div>
                    <div class="card-body">
                        <!-- Mensagens de sucesso/erro -->
                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <form th:action="@{/register}" th:object="${registerDTO}" method="post">
                            <!-- Nome -->
                            <div class="mb-3">
                                <label for="name" class="form-label">Nome Completo *</label>
                                <input type="text" class="form-control" id="name" 
                                       th:field="*{name}" 
                                       placeholder="Digite seu nome completo" required>
                                <div th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></div>
                            </div>

                            <!-- E-mail -->
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail *</label>
                                <input type="email" class="form-control" id="email" 
                                       th:field="*{email}" 
                                       placeholder="Digite seu e-mail" required>
                                <div th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></div>
                            </div>

                            <!-- Senha -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Senha *</label>
                                <input type="password" class="form-control" id="password" 
                                       th:field="*{password}" 
                                       placeholder="Mínimo 8 caracteres" required>
                                <div th:if="${#fields.hasErrors('password')}" class="text-danger" th:errors="*{password}"></div>
                                <small class="text-muted">A senha deve ter no mínimo 8 caracteres.</small>
                            </div>

                            <!-- Perfil -->
                            <div class="mb-4">
                                <label class="form-label">Selecione seu Perfil *</label>
                                <div th:if="${#fields.hasErrors('role')}" class="text-danger" th:errors="*{role}"></div>
                                
                                <div class="row g-2 mt-1">
                                    <div class="col-4">
                                        <label class="role-option w-100 text-center" 
                                               th:classappend="${registerDTO.role == 'MEMBER' ? 'selected' : ''}">
                                            <input type="radio" th:field="*{role}" value="MEMBER">
                                            <i class="fas fa-user fa-2x text-primary"></i>
                                            <div class="mt-1"><strong>Membro</strong></div>
                                            <small class="text-muted">Registra diariamente</small>
                                        </label>
                                    </div>
                                    <div class="col-4">
                                        <label class="role-option w-100 text-center" 
                                               th:classappend="${registerDTO.role == 'LEADER' ? 'selected' : ''}">
                                            <input type="radio" th:field="*{role}" value="LEADER">
                                            <i class="fas fa-user-tie fa-2x text-warning"></i>
                                            <div class="mt-1"><strong>Líder</strong></div>
                                            <small class="text-muted">Gerencia equipe</small>
                                        </label>
                                    </div>
                                    <div class="col-4">
                                        <label class="role-option w-100 text-center" 
                                               th:classappend="${registerDTO.role == 'PROFESSOR' ? 'selected' : ''}">
                                            <input type="radio" th:field="*{role}" value="PROFESSOR">
                                            <i class="fas fa-chalkboard-teacher fa-2x text-danger"></i>
                                            <div class="mt-1"><strong>Professor</strong></div>
                                            <small class="text-muted">Acompanha equipes</small>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100">
                                <i class="fas fa-user-plus"></i> Cadastrar
                            </button>
                        </form>

                        <div class="mt-3 text-center">
                            <small>Já tem conta? <a href="/login">Faça login</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Adiciona evento de clique para selecionar perfil visualmente
        document.querySelectorAll('.role-option').forEach(option => {
            option.addEventListener('click', function() {
                const radio = this.querySelector('input[type="radio"]');
                if (radio) {
                    radio.checked = true;
                    // Remove 'selected' de todos os outros
                    document.querySelectorAll('.role-option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    this.classList.add('selected');
                }
            });
        });
    </script>
</body>
</html>
