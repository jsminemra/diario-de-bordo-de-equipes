<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${team.name} + ' - Detalhes da Equipe'">Equipe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 th:text="${team.name}"></h4>
                        <small>Líder: <span th:text="${team.leader.name}"></span></small>
                    </div>
                    <div class="card-body">
                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <!-- Adicionar Membro -->
                        <h5>Adicionar Membro</h5>
                        <form th:action="@{/leader/team/{teamId}/add-member(teamId=${team.id})}" 
                              th:object="${addMemberDTO}" 
                              method="post" 
                              class="mb-4">
                            <div class="input-group">
                                <input type="email" class="form-control" th:field="*{email}" 
                                       placeholder="E-mail do membro" required>
                                <button type="submit" class="btn btn-success">Adicionar</button>
                            </div>
                            <div th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></div>
                        </form>
                        
                        <!-- Lista de Membros -->
                        <h5>Membros da Equipe (<span th:text="${team.members.size()}"></span>)</h5>
                        <div class="list-group">
                            <div th:each="member : ${team.members}" class="list-group-item">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <strong th:text="${member.name}"></strong>
                                        <br>
                                        <small class="text-muted" th:text="${member.email}"></small>
                                    </div>
                                    <span th:if="${member.id == team.leader.id}" class="badge bg-warning">Líder</span>
                                    <span th:unless="${member.id == team.leader.id}" class="badge bg-secondary">Membro</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <a href="/leader/dashboard" class="btn btn-secondary">Voltar</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
