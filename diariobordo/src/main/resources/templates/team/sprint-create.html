<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/head :: commonHead('Criar Sprint')}"></head>
<body>

<!-- ── Top Nav ── -->
<div class="topnav">
  <div class="topnav-left">
    <div class="topnav-brand">
      <div class="mark">D</div>
      <div>Diário de Bordo</div>
    </div>
    <nav class="topnav-links">
      <a class="topnav-link" th:href="@{/leader/team/{id}(id=${team.id})}">Hoje</a>
      <a class="topnav-link" th:href="@{/leader/team/{id}/history(id=${team.id})}">Histórico</a>
      <a class="topnav-link" th:href="@{/leader/team/{id}/sprint/report(id=${team.id})}">Relatório</a>
    </nav>
  </div>
  <div class="topnav-right">
    <a href="/logout" class="btn btn-ghost btn-sm">Sair</a>
  </div>
</div>

<div class="page" style="max-width:560px;">

  <!-- ── Page header ── -->
  <div class="page-header">
    <div>
      <div class="label" style="margin-bottom:6px;" th:text="${team.name}"></div>
      <h1 class="h1" style="margin:0;">Nova sprint</h1>
      <p class="muted" style="margin:6px 0 0;font-size:13.5px;">
        Defina o nome e o período da próxima sprint.
      </p>
    </div>
    <a th:href="@{/leader/team/{id}(id=${team.id})}" class="btn btn-ghost">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Cancelar
    </a>
  </div>

  <!-- ── Error flash ── -->
  <div th:if="${error}"
       style="padding:12px 16px;border-radius:8px;background:var(--danger-bg,#fef2f2);color:var(--danger,#dc2626);
              border:0.5px solid var(--danger,#dc2626);font-size:13px;margin-bottom:20px;"
       th:text="${error}"></div>

  <!-- ── Form card ── -->
  <div class="card">
    <div class="card-body" style="padding:28px;">
      <form th:action="@{/leader/team/{teamId}/sprint/create(teamId=${team.id})}"
            th:object="${sprintCreateDTO}"
            method="post">

        <!-- Nome -->
        <div style="margin-bottom:20px;">
          <label style="display:block;font-size:12px;font-weight:600;color:var(--text-2);
                        text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;">
            Nome da sprint
          </label>
          <input type="text"
                 th:field="*{name}"
                 placeholder="Ex: Sprint 1, Sprint 2..."
                 style="width:100%;padding:9px 12px;border-radius:8px;border:0.5px solid var(--border);
                        background:var(--surface);color:var(--text);font-size:13.5px;
                        font-family:var(--sans);outline:none;box-sizing:border-box;"
                 required>
          <div th:if="${#fields.hasErrors('name')}"
               style="margin-top:5px;font-size:12px;color:var(--danger,#dc2626);"
               th:errors="*{name}"></div>
        </div>

        <!-- Datas -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
          <div>
            <label style="display:block;font-size:12px;font-weight:600;color:var(--text-2);
                          text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;">
              Data de início
            </label>
            <input type="date"
                   id="startDate"
                   th:field="*{startDate}"
                   style="width:100%;padding:9px 12px;border-radius:8px;border:0.5px solid var(--border);
                          background:var(--surface);color:var(--text);font-size:13.5px;
                          font-family:var(--mono);outline:none;box-sizing:border-box;"
                   required>
            <div th:if="${#fields.hasErrors('startDate')}"
                 style="margin-top:5px;font-size:12px;color:var(--danger,#dc2626);"
                 th:errors="*{startDate}"></div>
          </div>
          <div>
            <label style="display:block;font-size:12px;font-weight:600;color:var(--text-2);
                          text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;">
              Data de fim
            </label>
            <input type="date"
                   id="endDate"
                   th:field="*{endDate}"
                   style="width:100%;padding:9px 12px;border-radius:8px;border:0.5px solid var(--border);
                          background:var(--surface);color:var(--text);font-size:13.5px;
                          font-family:var(--mono);outline:none;box-sizing:border-box;"
                   required>
            <div th:if="${#fields.hasErrors('endDate')}"
                 style="margin-top:5px;font-size:12px;color:var(--danger,#dc2626);"
                 th:errors="*{endDate}"></div>
          </div>
        </div>

        <!-- Duração calculada -->
        <div id="duracaoBox"
             style="display:none;padding:12px 16px;border-radius:8px;background:var(--surface-2);
                    border:0.5px solid var(--border);font-size:13px;margin-bottom:24px;">
          <span style="color:var(--text-3);">Duração:</span>
          <span id="duracaoDias" class="mono" style="font-weight:600;margin-left:6px;"></span>
          <span style="color:var(--text-3);"> dias</span>
        </div>

        <!-- Submit -->
        <div style="display:flex;gap:10px;">
          <button type="submit" class="btn btn-primary">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Criar sprint
          </button>
          <a th:href="@{/leader/team/{id}(id=${team.id})}" class="btn btn-ghost">Cancelar</a>
        </div>

      </form>
    </div>
  </div>

</div>

<script>
  (function () {
    var start = document.getElementById('startDate');
    var end   = document.getElementById('endDate');
    var box   = document.getElementById('duracaoBox');
    var dias  = document.getElementById('duracaoDias');

    function update() {
      if (!start.value || !end.value) { box.style.display = 'none'; return; }
      var diff = Math.round((new Date(end.value) - new Date(start.value)) / 86400000);
      if (diff <= 0) { box.style.display = 'none'; return; }
      dias.textContent = diff;
      box.style.display = 'block';
    }

    start.addEventListener('change', update);
    end.addEventListener('change', update);
    update();
  })();
</script>

</body>
</html>
