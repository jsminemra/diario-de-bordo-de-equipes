<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Criar Sprint - Diário de Bordo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h4><i class="fas fa-rocket"></i> Criar Nova Sprint</h4>
                        <small>Equipe: <span th:text="${team.name}"></span></small>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <form th:action="@{/leader/team/{teamId}/sprint/create(teamId=${team.id})}" 
                              th:object="${sprintCreateDTO}" 
                              method="post">
                            
                            <div class="mb-3">
                                <label for="name" class="form-label">Nome da Sprint *</label>
                                <input type="text" class="form-control" id="name" 
                                       th:field="*{name}" 
                                       placeholder="Ex: Sprint 1, Sprint 2, ..." required>
                                <div th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="startDate" class="form-label">Data de Início *</label>
                                    <input type="date" class="form-control" id="startDate" 
                                           th:field="*{startDate}" required>
                                    <div th:if="${#fields.hasErrors('startDate')}" class="text-danger" th:errors="*{startDate}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="endDate" class="form-label">Data de Fim *</label>
                                    <input type="date" class="form-control" id="endDate" 
                                           th:field="*{endDate}" required>
                                    <div th:if="${#fields.hasErrors('endDate')}" class="text-danger" th:errors="*{endDate}"></div>
                                </div>
                            </div>
                            
                            <div class="alert alert-info">
                                <i class="fas fa-info-circle"></i> 
                                A sprint terá duração de <span id="duracao">-</span> dias.
                            </div>
                            
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-rocket"></i> Criar Sprint
                                </button>
                                <a th:href="@{/leader/team/{id}(id=${team.id})}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Calcular duração automaticamente
        document.addEventListener('DOMContentLoaded', function() {
            const startDate = document.getElementById('startDate');
            const endDate = document.getElementById('endDate');
            const duracao = document.getElementById('duracao');
            
            function calcularDuracao() {
                if (startDate.value && endDate.value) {
                    const start = new Date(startDate.value);
                    const end = new Date(endDate.value);
                    const diffTime = Math.abs(end - start);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    duracao.textContent = diffDays;
                } else {
                    duracao.textContent = '-';
                }
            }
            
            startDate.addEventListener('change', calcularDuracao);
            endDate.addEventListener('change', calcularDuracao);
        });
    </script>
</body>
</html>
