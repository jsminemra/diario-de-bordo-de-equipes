<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Feed da Equipe - Diário de Bordo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">
                <i class="fas fa-clipboard-list"></i> Diário de Bordo
            </span>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white">
                    <i class="fas fa-user-circle"></i>
                    Olá, <strong th:text="${userName}">Usuário</strong>!
                </span>
                <span class="badge bg-light text-primary" th:text="${user.role}">MEMBER</span>
                <a href="/logout" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <!-- Informações do perfil -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card border-primary">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center"
                             style="width:48px;height:48px;font-size:1.4rem;">
                            <i class="fas fa-user"></i>
                        </div>
                        <div>
                            <h5 class="mb-0" th:text="${userName}">Nome do Usuário</h5>
                            <small class="text-muted" th:text="${user.email}">email@email.com</small>
                        </div>
                        <span class="badge bg-primary ms-auto" th:text="${user.role}">MEMBER</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulário de Registro Diário -->
        <div class="row mb-4">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-edit"></i> Registro Diário</h5>
                    </div>
                    <div class="card-body">
                        <form method="post" th:action="@{/member/entry/create}">
                            <div class="mb-3">
                                <label class="form-label">📝 O que você fez hoje?</label>
                                <textarea class="form-control" rows="2" placeholder="Descreva o que você realizou..." required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">🎯 O que você fará amanhã?</label>
                                <textarea class="form-control" rows="2" placeholder="Descreva seus próximos passos..." required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">⚠️ Impedimentos?</label>
                                <textarea class="form-control" rows="2" placeholder="Algo está bloqueando seu trabalho?"></textarea>
                            </div>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i> Salvar Registro
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Feed de Registros -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-history"></i> Registros Recentes da Equipe</h5>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info mb-0">
                            <i class="fas fa-info-circle"></i> Nenhum registro encontrado para hoje.
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
