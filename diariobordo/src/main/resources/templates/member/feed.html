<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Feed da Equipe - Diário de Bordo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="bg-primary text-white p-3 rounded d-flex justify-content-between align-items-center">
                    <div>
                        <h2 class="mb-0"><i class="fas fa-clipboard-list"></i> Feed da Equipe</h2>
                        <p class="mb-0 small">Registros diários dos membros da sua equipe</p>
                    </div>
                    <a href="/member/team" class="btn btn-light btn-sm">
                        <i class="fas fa-users"></i> Minha Equipe
                    </a>
                </div>
            </div>
        </div>

        <!-- Formulário de Registro Diário -->
        <div class="row mb-4">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5><i class="fas fa-edit"></i> Registro Diário</h5>
                    </div>
                    <div class="card-body">
                        <form method="post" th:action="@{/member/entry/create}">
                            <div class="mb-3">
                                <label class="form-label">📝 O que você fez hoje?</label>
                                <textarea class="form-control" rows="2" placeholder="Descreva o que você realizou..." required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">🎯 O que você fará amanhã?</label>
                                <textarea class="form-control" rows="2" placeholder="Descreva seus próximos passos..." required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">⚠️ Impedimentos?</label>
                                <textarea class="form-control" rows="2" placeholder="Algo está bloqueando seu trabalho?"></textarea>
                            </div>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i> Salvar Registro
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Feed de Registros -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5><i class="fas fa-history"></i> Registros Recentes da Equipe</h5>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i> Nenhum registro encontrado para hoje.
                        </div>
                        
                        <!-- Exemplo de registro (será substituído pelo backend) -->
                        <div class="border rounded p-3 mb-2">
                            <div class="d-flex justify-content-between">
                                <strong><i class="fas fa-user"></i> João Membro</strong>
                                <small class="text-muted">10/06/2026 09:30</small>
                            </div>
                            <hr>
                            <p><strong>O que fez:</strong> Implementou a tela de login</p>
                            <p><strong>O que fará:</strong> Criar a tela de cadastro</p>
                            <p><strong>Impedimentos:</strong> Nenhum</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
